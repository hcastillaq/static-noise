name: Dispatch VS Code synchronization

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect VS Code artifact changes
        id: changed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == 'v0.0.1' ]]; then
            echo 'dispatch=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null)"; then
            echo 'dispatch=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$previous_tag" "$GITHUB_SHA" -- dist/vscode/static-noise-color-theme.json; then
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch VS Code synchronization
        if: steps.changed.outputs.dispatch == 'true'
        uses: actions/github-script@v7
        env:
          SYNC_TOKEN: ${{ secrets.STATIC_NOISE_SYNC_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (!process.env.SYNC_TOKEN) {
              core.notice('STATIC_NOISE_SYNC_TOKEN is not configured; skipping VS Code dispatch.');
              return;
            }
            const tag = context.ref.replace('refs/tags/', '');
            const response = await fetch(
              `https://api.github.com/repos/${context.repo.owner}/static-noise.vscode/dispatches`,
              {
                method: 'POST',
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${process.env.SYNC_TOKEN}`,
                  'User-Agent': 'static-noise-sync',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
                body: JSON.stringify({
                  event_type: 'static-noise-release',
                  client_payload: {
                    tag,
                    sha: context.sha,
                    version: tag.replace(/^v/, ''),
                    bootstrap: tag === 'v0.0.1',
                  },
                }),
              },
            );
            if (!response.ok) {
              throw new Error(`Dispatch to static-noise.vscode failed with HTTP ${response.status}: ${await response.text()}`);
            }
