name: Dispatch consumer synchronization

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          SYNC_TOKEN: ${{ secrets.STATIC_NOISE_SYNC_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (!process.env.SYNC_TOKEN) {
              core.notice('STATIC_NOISE_SYNC_TOKEN is not configured; skipping consumer dispatch during bootstrap.');
              return;
            }
            const tag = context.ref.replace('refs/tags/', '');
            const payload = {
              tag,
              sha: context.sha,
              version: tag.replace(/^v/, ''),
              bootstrap: tag === 'v0.0.1',
            };
            for (const repo of ['static-noise.vscode', 'static-noise.nvim']) {
              const response = await fetch(
                `https://api.github.com/repos/${context.repo.owner}/${repo}/dispatches`,
                {
                  method: 'POST',
                  headers: {
                    Accept: 'application/vnd.github+json',
                    Authorization: `Bearer ${process.env.SYNC_TOKEN}`,
                    'User-Agent': 'static-noise-sync',
                    'X-GitHub-Api-Version': '2022-11-28',
                  },
                  body: JSON.stringify({
                    event_type: 'static-noise-release',
                    client_payload: payload,
                  }),
                },
              );
              if (!response.ok) {
                throw new Error(`Dispatch to ${repo} failed with HTTP ${response.status}: ${await response.text()}`);
              }
            }
