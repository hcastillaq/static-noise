<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
  <title id="title">Static Noise complete visual identity guide</title>
  <desc id="desc">Primitive colors, semantic surfaces and content, accents, dim variants, syntax roles, diff states and ANSI projection.</desc>
  <rect width="1400" height="1120" fill="#0F1117"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
