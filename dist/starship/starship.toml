# Generated from palette.json. Do not edit generated output manually.
# ==============================================================================
# CONFIGURACIÓN DE STARSHIP (TEMA STATIC NOISE & FLAT NERD ICONS)
# ==============================================================================

palette = "static-noise"

# --- CONFIGURACIÓN GLOBAL ---
add_newline = false
command_timeout = 2000

# --- ESTRUCTURA DEL PROMPT ---
format = """
$kubernetes$docker_context$directory$git_branch$git_status$mise$nodejs$python$rust$golang$java$cmd_duration
$character
"""

# ==============================================================================
# MÓDULOS DE ENTORNO Y HERRAMIENTAS
# ==============================================================================

# --- DIRECTORY (Ruta actual) ---
[directory]
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style) "
style = "bold fg:#83BFFF" # Blue (Identificadores y rutas)
read_only = " "
read_only_style = "bold fg:#EF7785" # Red (Alerta)

# --- KUBERNETES ---
[kubernetes]
disabled = false
symbol = "☸ "
format = '[$symbol$context]($style) '
style = 'bold fg:#72EAD5' # Cyan (Operador / cluster activo)
detect_files = []
detect_extensions = []
detect_folders = []

# --- DOCKER CONTEXT ---
[docker_context]
disabled = false
symbol = " "
format = '[$symbol$context]($style) '
style = 'bold fg:#83BFFF' # Blue
only_with_files = true

# --- MISE ---
[mise]
disabled = false
symbol = " "
format = '[$symbol$tool@$version]($style) '
style = 'bold fg:#C2A7FF' # Purple

# --- NODEJS ---
[nodejs]
symbol = " "
format = '[$symbol$version]($style) '
style = 'bold fg:#A3D98B' # Green
detect_extensions = ["js", "ts", "tsx", "mjs", "cjs"]
detect_files = ["package.json", ".nvmrc", "bun.lockb", "pnpm-lock.yaml"]
detect_folders = ["node_modules"]

# --- PYTHON ---
[python]
symbol = " "
format = '[$symbol($version )(\((virtualenv) \))]($style) '
style = "bold fg:#EDD071" # Yellow
detect_files = [".venv", "uv.lock", "pyproject.toml", "requirements.txt"]
detect_extensions = ["py"]

# --- RUST ---
[rust]
symbol = " "
format = '[$symbol$version]($style) '
style = "bold fg:#F3A261" # Orange
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

# --- GOLANG ---
[golang]
symbol = " "
format = '[$symbol$version]($style) '
style = "bold fg:#72EAD5" # Cyan
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum", "go.work"]

# --- JAVA ---
[java]
symbol = " "
format = '[$symbol$version]($style) '
style = 'bold fg:#F08BC2' # Pink
detect_extensions = ["java", "class", "jar", "gradle", "pom.xml"]

# ==============================================================================
# MÓDULOS DE GIT
# ==============================================================================

[git_branch]
symbol = " "
format = '[$symbol$branch]($style) '
style = 'bold fg:#C2A7FF' # Purple (Ramas Git)

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'bold fg:#F3A261' # Orange (Modificaciones)
conflicted = " "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count} "
staged = "+${count} "
modified = "!${count} "
deleted = "✘${count} "

# ==============================================================================
# UTILIDADES ADICIONALES
# ==============================================================================

# --- TIEMPO DE EJECUCIÓN ---
[cmd_duration]
min_time = 2000
format = '[ $duration]($style) '
style = 'bold fg:#EDD071' # Yellow (Duración y métricas)

# ==============================================================================
# CARÁCTER DE ENTRADA (PROMPT CHARACTER)
# ==============================================================================
[character]
success_symbol = '[->](bold fg:#72EAD5)' # Cyan (Foco activo)
error_symbol = '[->](bold fg:#EF7785)'   # Red (Error)
vimcmd_symbol = '[<-](bold fg:#A3D98B)'  # Green (Modo normal Vi)

[palettes.static-noise]
void = "#0F1117"
surface = "#141720"
foreground = "#E6E2D6"
soft = "#C9C8C2"
muted = "#9299AE"
dim = "#62697B"
cyan = "#72EAD5"
blue = "#83BFFF"
purple = "#C2A7FF"
magenta = "#F08BC2"
green = "#A3D98B"
yellow = "#EDD071"
orange = "#F3A261"
red = "#EF7785"
