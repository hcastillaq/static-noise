# Static Noise theme for lazygit
# Generated from palette.json. Do not edit generated output manually.

gui:
  theme:
    activeBorderColor:
      - '#72EAD5'
      - bold
    inactiveBorderColor:
      - '#272C3E'
    searchingInactiveBorderColor:
      - '#3D4460'
    searchingActiveBorderColor:
      - '#F3A261'
      - bold
    optionsTextColor:
      - '#72EAD5'
    selectedLineBgColor:
      - '#193C3B'
    inactiveViewSelectedLineBgColor:
      - '#242B3D'
    activeViewSelectedLineBgColor:
      - '#193C3B'
    inactiveViewSelectedLineFgColor:
      - '#9299AE'
    activeViewSelectedLineFgColor:
      - '#E6E2D6'
    selectedRangeBgColor:
      - '#20344D'
    selectedRangeFgColor:
      - '#E6E2D6'
    cherryPickedCommitBgColor:
      - '#332B4D'
    cherryPickedCommitFgColor:
      - '#72EAD5'
    unstagedChangesColor:
      - '#EF7785'
    stagedChangesColor:
      - '#A3D98B'
    markedBaseCommitFgColor:
      - '#EDD071'
    markedBaseCommitBgColor:
      - '#443B25'
    defaultFgColor:
      - '#E6E2D6'
  showIcons: true
  nerdFontsVersion: "3"
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --line-numbers
